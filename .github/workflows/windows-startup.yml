name: Windows startup

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-315-recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Recover an incomplete Python 3.15 environment with a supported runtime
        run: python tests/windows_smoke.py --unsupported-python
  no-python:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and install Python, then launch with no Python on PATH
        run: python tests/windows_smoke.py --without-python
  startup:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Start real server through run.bat in a clean directory
        run: python tests/windows_smoke.py
      - name: Run regression tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
